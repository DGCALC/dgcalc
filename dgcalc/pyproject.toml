[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgcalc"
# To update version: _F/update_version.py
version = "0.3.0"
description = "A source code/environment manager for C, C++, and Fortran."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tomli>=2.0.2; python_version < '3.11'",
]

authors = [
    {name = "Lucius Schoenbaum", email = "lts0016@uah.edu"},
]

[project.license]
text = "MIT"

keywords = ["package management", "scientific computing"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/DGCALC/DGCALC"
Documentation = "https://github.com/LuciusSchoenbaum/DGCALC/DGCALC"
Repository = "https://github.com/DGCALC/DGCALC.git"
Issues = "https://github.com/DGCALC/DGCALC/issues"

[project.scripts]
dgcalc = "dgcalc.dgcalc:main"

[tool.hatch.build]
exclude = [
    "**/.DS_Store",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
exclude = [
    # "_test",
    # syntax hints:
    # "tests/*.log",
    # "tests/snapshots/*.json",
]

[tool.hatch.build.targets.sdist]
exclude = [
    # nothing at this time.
    # "**/.DS_Store",
]

# work in progress.
# For `pytest` automated testing that won't
# be needed for the foreseeable time.
[tool.pytest.ini_options]
testpaths = ["_test/_N"]

